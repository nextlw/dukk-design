  "/api/test/connection":
    post:
      tags:
      - Chat
      summary: Testa a conexão de um provider ou agente (diálogo de configurações)
      operationId: testConnection
      description: |
        Sempre retorna HTTP 200 com `ok: false` em falhas causadas pelo upstream,
        para que o diálogo de configurações possa renderizar o status inline sem precisar desempacotar envelopes de erro.
        Use `mode` para selecionar o alvo do teste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - provider
                  - agent
                protocol:
                  type: string
                  enum:
                  - anthropic
                  - openai
                  - azure
                  - google
                  - ollama
                  - senseaudio
                  - aihubmix
                  description: Obrigatório quando mode=provider
                baseUrl:
                  type: string
                  description: Obrigatório quando mode=provider
                apiKey:
                  type: string
                  description: Obrigatório quando mode=provider
                model:
                  type: string
                  description: Obrigatório quando mode=provider ou mode=agent
                apiVersion:
                  type: string
                  description: Versão opcional da API do Azure (mode=provider)
                agentId:
                  type: string
                  description: Obrigatório quando mode=agent
                reasoning:
                  type: string
                  description: ID opcional do modo de raciocínio (mode=agent)
                agentCliEnv:
                  type: object
                  description: Variáveis de ambiente opcionais para o processo CLI
                    do agente (mode=agent)
      responses:
        '200':
          description: Resultado do teste de conexão (ok true/false com latência e
            detalhe)
          content:
            application/json:
              schema:
                type: object
                description: ConnectionTestResult — ver connectionTest.ts
        '400':
          "$ref": "#/components/responses/ApiError"
