                    type: array
                    items:
                      "$ref": "#/components/schemas/LiveArtifactSummary"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/tools/live-artifacts/refresh":
    post:
      tags:
      - LiveArtifacts
      summary: Atualiza (refresh) live artifact autenticado via tool
      operationId: toolRefreshLiveArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - artifactId
              properties:
                projectId:
                  type: string
                  description: Derivado do token de tool; fornecê-lo retorna 403
                artifactId:
                  type: string
      responses:
        '200':
          description: Resultado do refresh
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiveArtifactRefreshResponse"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/tools/live-artifacts/update":
    post:
      tags:
      - LiveArtifacts
      summary: Atualiza live artifact autenticado via tool
      operationId: toolUpdateLiveArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - artifactId
              properties:
                projectId:
                  type: string
                  description: Derivado do token de tool; fornecê-lo retorna 403
                artifactId:
                  type: string
                input:
                  type: object
                  description: LiveArtifactUpdateInput — ver contracts
                templateHtml:
                  type: string
                provenanceJson:
                  type: string
      responses:
        '200':
          description: Live artifact atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifact:
                    "$ref": "#/components/schemas/LiveArtifact"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/tools/media/generate":
    post:
      tags:
      - Media
      summary: Enfileira uma tarefa de geração de mídia via token de tool (voltado
        ao agente)
      operationId: postToolsMediaGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MediaGenerateRequest"
      responses:
        '202':
          description: Tarefa aceita; consulte /api/media/tasks/{taskId}/wait para
            aguardar a conclusão
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MediaTaskAccepted"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/upload":
    post:
      tags:
      - Projects
      summary: Faz upload de imagens (genérico, até 8 arquivos)
      operationId: uploadImages
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        size:
                          type: integer
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/version":
    get:
      tags:
      - System
      summary: Obtém informações de versão do daemon
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Informações de versão
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: object
  "/api/xai/auth/status":
    get:
      tags:
      - XAI
      summary: Obtém presença de token OAuth do xAI e status do listener
      operationId: getXaiAuthStatus
      x-require-same-origin: true
      responses:
        '200':
          description: Flag de conexão, expiração, escopo e bit indicador de listener
            em andamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  listening:
                    type: boolean
                  expiresAt:
                    type:
                    - integer
                    - 'null'
                  scope:
                    type:
                    - string
                    - 'null'
                  savedAt:
                    type: integer
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/xai/oauth/cancel":
    post:
      tags:
      - XAI
      summary: Cancela o listener OAuth do xAI em andamento sem apagar o token armazenado
      operationId: cancelXaiOAuth
      x-require-same-origin: true
      responses:
        '200':
          description: Listener encerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/xai/oauth/complete":
    post:
      tags:
      - XAI
      summary: Conclui o OAuth do xAI colando manualmente state e code
      operationId: completeXaiOAuth
      x-require-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              - code
              properties:
                state:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Token trocado e armazenado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/xai/oauth/disconnect":
    post:
      tags:
      - XAI
      summary: Encerra o listener OAuth do xAI e limpa o token armazenado
      operationId: disconnectXaiOAuth
      x-require-same-origin: true
      responses:
        '200':
          description: Token removido e listener encerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/xai/oauth/start":
    post:
      tags:
      - XAI
      summary: Inicia o fluxo OAuth PKCE do xAI (abre listener de loopback em :56121)
      operationId: startXaiOAuth
      x-require-same-origin: true
      responses:
        '200':
          description: URL de autorização, state do PKCE e endereço de callback de
            loopback
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizeUrl:
                    type: string
                  state:
                    type: string
                  callback:
                    type: object
                    properties:
                      host:
                        type: string
                      port:
                        type: integer
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/xai/search":
    post:
      tags:
      - XAI
      summary: Pesquisa posts do X via tool x_search do Grok
      operationId: xaiSearch
      x-require-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                model:
                  type: string
                  description: Padrão grok-4.20-reasoning
                allowed_x_handles:
                  type: array
                  items:
                    type: string
                excluded_x_handles:
                  type: array
                  items:
                    type: string
                from_date:
                  type: string
                  description: String de data ISO
                to_date:
                  type: string
                  description: String de data ISO
                enable_image_understanding:
                  type: boolean
                enable_video_understanding:
                  type: boolean
      responses:
        '200':
          description: Texto da resposta da pesquisa, citações e modelo utilizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  citations:
                    type: array
                    items:
                      type: string
                  model:
                    type: string
        '400':
          "$ref": "#/components/responses/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OD_API_TOKEN. Exigido para acesso não-loopback; loopback/same-origin
        é isento.
  responses:
    ApiError:
      description: Erro padrão da API
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorResponse"
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - VALIDATION_FAILED
          - AGENT_UNAVAILABLE
          - AGENT_AUTH_REQUIRED
          - AGENT_EXECUTION_FAILED
          - AGENT_CONNECTION_DROPPED
          - AGENT_PROMPT_TOO_LARGE
          - AMR_MODEL_UNAVAILABLE
          - AMR_AUTH_REQUIRED
          - AMR_INSUFFICIENT_BALANCE
          - ROLE_MARKER_HALLUCINATION
          - AGENT_RUNTIME_DEF_INVALID
          - PROJECT_NOT_FOUND
          - CONVERSATION_NOT_FOUND
          - EMPTY_TRANSCRIPT
          - FILE_NOT_FOUND
          - ARTIFACT_NOT_FOUND
          - ARTIFACT_REGRESSION
          - ARTIFACT_PUBLICATION_BLOCKED
          - UPSTREAM_UNAVAILABLE
          - RATE_LIMITED
          - DESKTOP_AUTH_PENDING
          - TOOL_TOKEN_MISSING
          - TOOL_TOKEN_INVALID
          - TOOL_TOKEN_EXPIRED
          - TOOL_ENDPOINT_DENIED
          - TOOL_OPERATION_DENIED
          - MEDIA_EXECUTION_DISABLED
          - MEDIA_SURFACE_DENIED
          - MEDIA_MODEL_DENIED
          - LIVE_ARTIFACT_NOT_FOUND
          - LIVE_ARTIFACT_INVALID
          - LIVE_ARTIFACT_STORAGE_FAILED
          - LIVE_ARTIFACT_REFRESH_UNAVAILABLE
          - LIVE_ARTIFACT_REFRESH_TIMEOUT
