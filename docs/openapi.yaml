  "/api/proxy/aihubmix/stream":
    post:
      tags:
      - Chat
      summary: Proxy BYOK — chat AIHubMix com protocolo roteado por modelo (OpenAI/Anthropic/Gemini)
        e tools de mídia opcionais
      operationId: proxyAIHubMixStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - apiKey
              - model
              - projectId
              properties:
                baseUrl:
                  type: string
                  description: Override opcional (padrão é URL base do AIHubMix)
                apiKey:
                  type: string
                model:
                  type: string
                  description: ID do modelo — roteamento para wire Anthropic/Gemini/OpenAI
                    é automático com base no prefixo do nome do modelo
                systemPrompt:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                maxTokens:
                  type: integer
                  default: 8192
                projectId:
                  type: string
                  description: ID do projeto ativo (obrigatório para escritas de arquivo
                    via tool de mídia)
                byokImageModel:
                  type: string
                byokVideoModel:
                  type: string
                byokSpeechModel:
                  type: string
                byokSpeechVoice:
                  type: string
      responses:
        '200':
          description: |
            Stream SSE. Eventos: `start` {model}, `delta` {delta: string},
            `end` {}, `error` {message, error: {code, message, retryable?}}.
            Para prefixos de modelo claude/gemini o daemon roteia para o wire do protocolo nativo.
            Para modelos da família OpenAI o loop de tool generate_image/video/speech está ativo
            (até 3 turnos). URLs de mídia são embutidas nos deltas de texto subsequentes.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/ApiError"
