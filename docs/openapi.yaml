---
openapi: 3.1.0
info:
  title: Open Design Daemon API
  version: 0.11.0
  description: |-
    API HTTP do daemon `od` do Open Design (fork nextlw/dukk-design).
    Gerada por extração estática das rotas Express em `apps/daemon/src/` e dos contratos em `packages/contracts/`. Onde o tipo TS é complexo, o schema é `object` com referência ao contrato de origem.

    Auth: requisições não-loopback exigem `Authorization: Bearer <OD_API_TOKEN>` quando `OD_API_TOKEN` está definido; `/api/health`, `/api/ready` e `/api/version` são públicos. Rotas marcadas com `x-require-same-origin: true` exigem origem local (navegador same-origin), não apenas token.
  license:
    name: Apache-2.0
servers:
- url: http://localhost:7456
  description: Daemon local (porta default)
security:
- bearerAuth: []
tags:
- name: ActiveContext
- name: Agents
- name: Automations
- name: Chat
- name: Connectors
- name: Deploy
- name: DesignSystems
- name: GenUI
- name: Handoff
- name: HostTools
- name: ImportExport
- name: LiveArtifacts
- name: MCP
- name: Media
- name: Memory
- name: Plugins
- name: Plugins-Marketplace
- name: Projects
- name: Routines
- name: Runs
- name: SocialShare
- name: StaticResources
- name: System
- name: Terminal
- name: Vela
- name: XAI
paths:
  "/api/active":
    get:
      tags:
      - ActiveContext
      summary: Obtém o contexto ativo atual
      operationId: getActiveContext
      x-require-same-origin: true
      responses:
        '200':
          description: Contexto ativo ou sinal de inativo
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    active:
                      type: boolean
                      enum:
                      - false
                - type: object
                  properties:
                    active:
                      type: boolean
                      enum:
                      - true
                    projectId:
                      type: string
                    projectName:
                      type:
                      - string
                      - 'null'
                    fileName:
                      type:
                      - string
                      - 'null'
                    ts:
                      type: integer
                      description: Unix timestamp (ms)
                    ageMs:
                      type: integer
        '400':
          "$ref": "#/components/responses/ApiError"
    post:
      tags:
      - ActiveContext
      summary: Define ou limpa o contexto ativo
      operationId: postActiveContext
      x-require-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: Limpa o contexto ativo
                properties:
                  active:
                    type: boolean
                    enum:
                    - false
                required:
                - active
              - type: object
                description: Define o contexto ativo
                required:
                - projectId
                properties:
                  projectId:
                    type: string
                  fileName:
                    type:
                    - string
                    - 'null'
      responses:
        '200':
          description: Estado do contexto atualizado
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    active:
                      type: boolean
                      enum:
                      - false
                - type: object
                  properties:
                    active:
                      type: boolean
                      enum:
                      - true
                    projectId:
                      type: string
                    fileName:
                      type:
                      - string
                      - 'null'
                    ts:
                      type: integer
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/agents":
    get:
      tags:
      - StaticResources
      summary: Lista agentes detectados ou transmite sondagens de agentes via SSE
      operationId: listAgents
      parameters:
      - name: stream
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
          - 'true'
          - 'false'
        description: Passe "1" ou "true" para receber um stream Server-Sent Events
      responses:
        '200':
          description: Lista de agentes (JSON) ou stream SSE
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
            text/event-stream:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/agents/{agentId}/oauth-launch":
    post:
      tags:
      - Agents
      summary: Inicia o fluxo OAuth do agente no terminal do sistema (somente loopback)
      operationId: postAgentOauthLaunch
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
        description: Identificador do agente; atualmente apenas "antigravity" é suportado
      responses:
        '200':
          description: Resultado da inicialização
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  platform:
                    type: string
                  via:
                    type: string
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
        '500':
          description: Falha na inicialização
          content:
            application/json:
              schema:
                type: object
  "/api/amr/models":
    get:
      tags:
      - Vela
      summary: Lista os modelos AMR (Vela) disponíveis
      operationId: listAmrModels
      responses:
        '200':
          description: Lista de modelos AMR
          content:
            application/json:
              schema:
                type: object
                description: AMR models response — ver Vela runtime types
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/analytics/config":
    get:
      tags:
      - System
      summary: Configuração de runtime de analytics do PostHog
      operationId: getAnalyticsConfig
      security: []
      responses:
        '200':
          description: Configuração de analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  env:
                    type: string
                  key:
                    type:
                    - string
                    - 'null'
                  host:
                    type:
                    - string
                    - 'null'
                  installationId:
                    type:
                    - string
                    - 'null'
  "/api/app-config":
    get:
      tags:
      - Media
      summary: Lê a configuração da aplicação
      operationId: getAppConfig
      x-require-same-origin: true
      responses:
        '200':
          description: Configuração da aplicação
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    "$ref": "#/components/schemas/AppConfigPrefs"
        '400':
          "$ref": "#/components/responses/ApiError"
    put:
      tags:
      - Media
      summary: Grava a configuração da aplicação
      operationId: putAppConfig
      x-require-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateAppConfigRequest"
      responses:
        '200':
          description: Configuração da aplicação atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    "$ref": "#/components/schemas/AppConfigPrefs"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/applied-plugins":
    get:
      tags:
      - Plugins
      summary: Lista os snapshots de plugins aplicados recentes (últimos 500)
      operationId: listAppliedPlugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AppliedPluginSnapshot"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/applied-plugins/export":
    post:
      tags:
      - Plugins
      summary: Exporta snapshots de plugins aplicados (somente daemon local)
      operationId: exportAppliedPlugins
      x-require-same-origin: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Opções de filtro de exportação — ver contracts/plugins
      responses:
        '200':
          description: Resultado da exportação
          content:
            application/json:
              schema:
                type: object
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/applied-plugins/prune":
    post:
      tags:
      - Plugins
      summary: Remove snapshots de plugins aplicados expirados
      operationId: pruneAppliedPlugins
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  type: integer
                  description: Epoch ms — remove snapshots mais antigos que este valor
      responses:
        '200':
          description: Resultado da remoção
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  removed:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/applied-plugins/{snapshotId}":
    get:
      tags:
      - Plugins
      summary: Obtém um único snapshot de plugin aplicado
      operationId: getAppliedPlugin
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AppliedPluginSnapshot"
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/applied-plugins/{snapshotId}/canon":
    get:
      tags:
      - Plugins
      summary: Obtém o bloco de prompt canônico de um snapshot de plugin aplicado
      operationId: getAppliedPluginCanon
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bloco canônico como JSON ou texto simples (negociado via cabeçalho
            Accept)
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshotId:
                    type: string
                  pluginId:
                    type: string
                  block:
                    type: string
            text/plain:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/artifacts/lint":
    post:
      tags:
      - Projects
      summary: Faz lint de um artifact HTML sem salvar
      operationId: lintArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                html:
                  type: string
              required:
              - html
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: object
                  agentMessage:
                    type: string
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/artifacts/save":
    post:
      tags:
      - Projects
      summary: Salva um artifact HTML em disco
      operationId: saveArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                title:
                  type: string
                html:
                  type: string
              required:
              - html
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  url:
                    type: string
                  lint:
                    type: object
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/asset-cache":
    get:
      tags:
      - Plugins
      summary: Faz proxy e cache de uma URL de asset externo
      operationId: getAssetCache
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: URL externa do asset para proxy/cache
      responses:
        '200':
          description: Bytes do asset em cache
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          "$ref": "#/components/responses/ApiError"
        '502':
          description: Erro ao buscar upstream
  "/api/atoms":
    get:
      tags:
      - StaticResources
      summary: Lista todos os atoms próprios
      operationId: listAtoms
      responses:
        '200':
          description: Lista de atoms
          content:
            application/json:
              schema:
                type: object
                properties:
                  atoms:
                    type: array
                    items:
                      type: object
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/atoms/{id}":
    get:
      tags:
      - StaticResources
      summary: Obtém atom por ID
      operationId: getAtomById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detalhe do atom
          content:
            application/json:
              schema:
                type: object
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-ingestions":
    post:
      tags:
      - Automations
      summary: Ingere uma fonte de automação
      operationId: ingestAutomationSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: AutomationSourceInput — ver contracts
      responses:
        '200':
          description: Resultado da ingestão
          content:
            application/json:
              schema:
                type: object
                description: AutomationIngestionResult — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-proposals":
    get:
      tags:
      - Automations
      summary: Lista propostas de automação
      operationId: listAutomationProposals
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          description: 'Filtra por AutomationProposalStatus ou ''all'' (padrão). Os
            valores dependem do enum AutomationProposalStatus de @open-design/contracts.

'
      responses:
        '200':
          description: Lista de propostas
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      type: object
                      description: AutomationProposal — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
    post:
      tags:
      - Automations
      summary: Cria uma proposta de automação
      operationId: createAutomationProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: AutomationProposalInput — ver contracts
      responses:
        '200':
          description: Proposta criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    type: object
                    description: AutomationProposal — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-proposals/{id}":
    get:
      tags:
      - Automations
      summary: Obtém uma proposta de automação por ID
      operationId: getAutomationProposal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Proposta de automação
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    type: object
                    description: AutomationProposal — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-proposals/{id}/apply":
    post:
      tags:
      - Automations
      summary: Aplica uma proposta de automação
      operationId: applyAutomationProposal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resultado da aplicação
          content:
            application/json:
              schema:
                type: object
                description: AutomationApplyResult — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-proposals/{id}/reject":
    post:
      tags:
      - Automations
      summary: Rejeita uma proposta de automação
      operationId: rejectAutomationProposal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Proposta rejeitada
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    type: object
                    description: AutomationProposal — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-source-packets":
    get:
      tags:
      - Automations
      summary: Lista pacotes de fontes de automação
      operationId: listAutomationSourcePackets
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Lista de pacotes de fontes
          content:
            application/json:
              schema:
                type: object
                properties:
                  packets:
                    type: array
                    items:
                      type: object
                      description: AutomationSourcePacket — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-source-packets/{id}":
    get:
      tags:
      - Automations
      summary: Obtém um pacote de fonte de automação por ID
      operationId: getAutomationSourcePacket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pacote de fonte de automação
          content:
            application/json:
              schema:
                type: object
                properties:
                  packet:
                    type: object
                    description: AutomationSourcePacket — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-templates":
    get:
      tags:
      - Routines
      summary: Lista todos os templates de automação
      operationId: listAutomationTemplates
      responses:
        '200':
          description: Lista de templates de automação
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      description: AutomationTemplate — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/automation-templates/{id}":
    get:
      tags:
      - Routines
      summary: Obtém um template de automação por ID
      operationId: getAutomationTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detalhe do template de automação
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    type: object
                    description: AutomationTemplate — ver contracts
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/chat":
    post:
      tags:
      - Runs
      summary: Inicia um chat run e transmite os eventos inline (SSE)
      operationId: postChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ChatRequest — ver contracts/api/chat.ts
              properties:
                projectId:
                  type: string
                conversationId:
                  type: string
                assistantMessageId:
                  type: string
                message:
                  type: string
                agentId:
                  type: string
                pluginId:
                  type: string
                appliedPluginSnapshotId:
                  type: string
                mediaExecution:
                  type: object
                toolBundle:
                  type: object
      responses:
        '200':
          description: Stream SSE de ChatSseEvent
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/ApiError"
        '503':
          description: Daemon encerrando
          content:
            application/json:
              schema:
                type: object
  "/api/codex-pets":
    get:
      tags:
      - StaticResources
      summary: Lista entradas do registro hatch-pet do Codex
      operationId: listCodexPets
      responses:
        '200':
          description: Lista de pets do Codex
          content:
            application/json:
              schema:
                type: object
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/codex-pets/sync":
    post:
      tags:
      - StaticResources
      summary: Sincronização com um clique de pets da comunidade dos catálogos petshare/hatchery
      operationId: syncCodexPets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum:
                  - all
                  - petshare
                  - hatchery
                  default: all
                force:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Resultado da sincronização
          content:
            application/json:
              schema:
                type: object
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/codex-pets/{id}/spritesheet":
    get:
      tags:
      - StaticResources
      summary: Serve a imagem de spritesheet de um pet Codex
      operationId: getCodexPetSpritesheet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Imagem de spritesheet (webp, gif ou png)
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          "$ref": "#/components/responses/ApiError"
        '404':
          "$ref": "#/components/responses/ApiError"
  "/api/community/discord":
    get:
      tags:
      - System
      summary: Informações de presença da comunidade no Discord
      operationId: getCommunityDiscord
      security: []
      responses:
        '200':
          description: Presença no Discord
          content:
            application/json:
              schema:
                type: object
                description: OpenDesignDiscordPresenceResponse — ver contracts
        '502':
          description: Erro upstream
          content:
            application/json:
              schema:
                type: object
  "/api/connectors":
    get:
      tags:
      - Connectors
      summary: Lista todos os conectores
      operationId: listConnectors
      responses:
        '200':
          description: Lista de detalhes dos conectores
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ConnectorDetail"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/connectors/auth-configs/prepare":
    post:
      tags:
      - Connectors
      summary: Prepara configurações de auth OAuth para múltiplos conectores
      operationId: prepareConnectorAuthConfigs
      x-require-same-origin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connectorIds
              properties:
                connectorIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: IDs dos conectores para preparar configurações de auth
      responses:
        '200':
          description: Resultados da preparação de configuração de auth indexados
            pelo ID do conector
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConnectorAuthConfigPrepareResponse"
        '400':
          "$ref": "#/components/responses/ApiError"
  "/api/connectors/composio/config":
    get:
      tags:
      - Connectors
      summary: Lê a configuração pública do Composio
      operationId: getComposioConfig
      responses:
        '200':
          description: Configuração pública do Composio (sem segredos)
          content:
